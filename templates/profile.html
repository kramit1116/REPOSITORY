{% extends 'layout.html' %}

{% block title %}
    Profile Page
{% endblock %}

{% block content %}
    <div class="heading">
        <h1 class="display-1">
            Hello
            <span class="text-muted">@{{user.username}}!</span>
        </h1>
        <div class="profile-pic">
             <img src="https://api.dicebear.com/9.x/lorelei/svg?seed={{user.username}}" width='100' alt="">
        </div>
    </div>
    <!-- form for editing profile -->
    <form action="/profile" method="post" class="form">
        <div class="form-group">
            <label for="username" class="form-label">Username:</label>
            <input type="text" name="username" id="username" value="{{user.username}}" class="form-control" required >
        </div>
        <div class="form-group">
            <label for="cpassword" class="form-label">Current Password:</label>
            <input type="password" name="cpassword" id="cpassword" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">New Password:</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="name" class="form-label">Name:</label>
            <input type="text" name="name" id="name" value="{{user.name}}" class="form-control">
        </div>
        <div class="buttons">
            <div class="form-group">
                <input type="submit" value="Update" class="btn btn-warning">
            </div>
            <a href="{{url_for('logout')}}" class="btn btn-outline-danger">Logout</a>
        </div>
    </form>
{% endblock %}

{% block style %}
    <style>
        .heading {
            display:flex;
            flex-direction:row;
            justify-content:space-between;
            align-items:center;
        }
        .profile-pic {
            border-radius:50%;
            border:2px solid #ccc;
            overflow:hidden;
        }
        .buttons {
            display:flex;
            flex-direction:row;
            margin:10px;
            gap:10px;
            align-items: center;
            justify-content: center;
        }
    </style>
    
{% endblock %}
