{% extends 'layout.html' %}

{% block title %}
    Delete Category
{% endblock %}

{% block content %}
    <h1 class="display-1">
        Delete Category
    </h1>
    <p class="f3">Are you sure you want to delete the category "{{category.name}}"?</p>

    <form action="" method="post" class="my-form">
            <button type="submit" class="btn btn-danger">
               <i class="fa-solid fa-trash-can"></i>
                Delete
            </button>
{% endblock %}
